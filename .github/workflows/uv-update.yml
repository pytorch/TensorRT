name: Sync uv.lock

on:
  schedule:
    # Every Monday at 03:00 UTC; adjust as needed
    - cron: "0 3 * * 1"
  push:
    branches: [main]
    paths:
      - 'pyproject.toml'
      - 'setup.py'
      - 'dev_dep_versions.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-uv-lock:
    # A plain runner, because nothing here builds the project. The steps resolve and
    # verify a lockfile, which is pure metadata work: no GPU, no CUDA toolkit, no Bazel.
    # This job previously asked for a GPU runner inside a CUDA image and spent four
    # months failing before it started, on `nvidia-container-cli: unsatisfied condition:
    # cuda>=13.2`, so the only check the lock has was never running.
    runs-on: ubuntu-latest
    if: ${{ ! contains(github.actor, 'pytorchbot') }}
    environment: pytorchbot-env

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PYTORCHBOT_TOKEN }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          # Pinned, and the same pin every other place that writes this lock uses. uv
          # resolves differently between versions, so "latest" here means this job can
          # reject a lock that the daily updater just produced, or write one it would
          # not. See the note in executorch-pin-update.yml for why this pin is 0.12.5.
          version: "0.12.5"

      - name: UV lock and check for changes
        id: check-changes
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          set -x
          git config --global safe.directory "$GITHUB_WORKSPACE"

          if ! PYTHON_ONLY=1 uv lock --refresh --prerelease=allow --verbose; then
            echo "Error: Failed to update uv.lock"
            exit 1
          fi
          echo "successfully ran uv lock"
          if git diff --quiet uv.lock; then
            echo "No changes to uv.lock"
            exit 0
          fi
          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          echo "there is changes to the uv.lock file"

      - name: Validate the changes
        id: validate-changes
        if: steps.check-changes.outputs.has_changes == 'true'
        run: |
          set -euo pipefail
          set -x
          # --no-install-project keeps this a lockfile check. Installing the root
          # project runs a full Bazel build of the native library, which this job
          # does not need. Dependencies are still downloaded and hash-verified, so a
          # broken lock is still caught.
          # --prerelease=allow has to match the lock step above: uv records the
          # resolution mode in uv.lock and --locked rejects a lock resolved under
          # a different mode.
          # --all-extras so the optional dependencies are covered too. Dependency
          # groups are not covered: --all-groups on its own is rejected, because
          # pyproject.toml declares test_ext and quantization as conflicting.
          # Built outside the checkout: the auto-commit step matches on uv.lock only,
          # but keeping the environment out of the tree avoids any chance of it being
          # swept into a commit, and keeps `git diff` about the lock alone.
          if ! PYTHON_ONLY=1 UV_PROJECT_ENVIRONMENT="${RUNNER_TEMP}/lock-check-venv" \
              uv sync --locked --prerelease=allow --no-install-project --all-extras; then
            echo "Error: Failed to run uv sync --locked --prerelease=allow --no-install-project --all-extras"
            exit 1
          fi
          echo "valid_changes=true" >> "$GITHUB_OUTPUT"
          echo "successfully validated the changes to uv.lock"

      - name: Auto-commit changes
        uses: stefanzweifel/git-auto-commit-action@v7
        if: steps.validate-changes.outputs.valid_changes == 'true'
        with:
          commit_message: "chore: update uv.lock"
          branch: main
          commit_options: "--no-verify --signoff"
          file_pattern: uv.lock
          commit_user_name: Torch-TensorRT Github Bot
          commit_user_email: torch-tensorrt.github.bot@nvidia.com
          commit_author: Torch-TensorRT Github Bot <torch-tensorrt.github.bot@nvidia.com>

concurrency:
  group: ${{ github.workflow }}-uv-update-${{ github.event.pull_request.number || github.ref_name }}-${{ github.event_name == 'workflow_dispatch' }}
  cancel-in-progress: true