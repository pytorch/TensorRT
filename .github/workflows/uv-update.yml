name: Sync uv.lock

on:
  schedule:
    # Every Monday at 03:00 UTC; adjust as needed
    - cron: "0 3 * * 1"
  push:
    branches: [main]
    paths:
      - 'pyproject.toml'
      - 'setup.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-uv-lock:
    runs-on: linux.g5.4xlarge.nvidia.gpu
    if: ${{ ! contains(github.actor, 'pytorchbot') }}
    environment: pytorchbot-env
    container:
      # Unlike the other jobs, this one does not run packaging/pre_build_script.sh, so Bazel reads
      # the literal CUDA path in the checked-in MODULE.bazel rather than one rendered from
      # toolchains/ci_workspaces/MODULE.bazel.tmpl with ${CUDA_HOME} substituted. No step here
      # builds the project, so that path does not have to exist in this image and this tag does
      # not have to track it.
      image: pytorch/manylinux2_28-builder:cuda13.2
      options: --gpus all
      env:
        CUDA_VERSION: 13.2
        CUDA_HOME: /usr/local/cuda

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PYTORCHBOT_TOKEN }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Install bazel
        run: |
         set -euo pipefail
         set -x
          curl -L https://github.com/bazelbuild/bazelisk/releases/download/v1.26.0/bazelisk-linux-amd64 \
          -o bazelisk-linux-amd64 \
          && mv bazelisk-linux-amd64 /usr/local/bin/bazel \
          && chmod +x /usr/local/bin/bazel
          bazel --version

      - name: UV lock and check for changes
        id: check-changes
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          set -x
          git config --global safe.directory "$GITHUB_WORKSPACE"

          if ! uv lock --refresh --prerelease=allow --verbose; then
            echo "Error: Failed to update uv.lock"
            exit 1
          fi
          echo "successfully ran uv lock"
          if git diff --quiet uv.lock; then
            echo "No changes to uv.lock"
            exit 0
          fi
          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          echo "there is changes to the uv.lock file"

      - name: Validate the changes
        id: validate-changes
        if: steps.check-changes.outputs.has_changes == 'true'
        run: |
          set -euo pipefail
          set -x
          # --no-install-project keeps this a lockfile check. Installing the root
          # project runs a full Bazel build of the native library, which this job
          # does not need and which ties it to the CUDA toolkit path MODULE.bazel
          # names. Dependencies are still downloaded and hash-verified, so a
          # broken lock is still caught.
          # --prerelease=allow has to match the lock step above: uv records the
          # resolution mode in uv.lock and --locked rejects a lock resolved under
          # a different mode.
          # --all-extras so the optional dependencies are covered too. Dependency
          # groups are not covered: --all-groups on its own is rejected, because
          # pyproject.toml declares test_ext and quantization as conflicting.
          if ! uv sync --locked --prerelease=allow --no-install-project --all-extras; then
            echo "Error: Failed to run uv sync --locked --prerelease=allow --no-install-project --all-extras"
            exit 1
          fi
          echo "valid_changes=true" >> "$GITHUB_OUTPUT"
          echo "successfully validated the changes to uv.lock"

      - name: Auto-commit changes
        uses: stefanzweifel/git-auto-commit-action@v7
        if: steps.validate-changes.outputs.valid_changes == 'true'
        with:
          commit_message: "chore: update uv.lock"
          branch: main
          commit_options: "--no-verify --signoff"
          file_pattern: uv.lock
          commit_user_name: Torch-TensorRT Github Bot
          commit_user_email: torch-tensorrt.github.bot@nvidia.com
          commit_author: Torch-TensorRT Github Bot <torch-tensorrt.github.bot@nvidia.com>

concurrency:
  group: ${{ github.workflow }}-uv-update-${{ github.event.pull_request.number || github.ref_name }}-${{ github.event_name == 'workflow_dispatch' }}
  cancel-in-progress: true