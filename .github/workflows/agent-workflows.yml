name: Core Reporting and Verification

on:
  pull_request:
    paths:
      - "setup.py"
      - "py/torch_tensorrt/reporting/**"
      - "py/torch_tensorrt/verification/**"
      - "py/torch_tensorrt/_compile.py"
      - "py/torch_tensorrt/__init__.py"
      - "py/torch_tensorrt/dynamo/__init__.py"
      - "py/torch_tensorrt/dynamo/_reporting.py"
      - "py/torch_tensorrt/dynamo/_compiler.py"
      - "py/torch_tensorrt/dynamo/_DryRunTracker.py"
      - "py/torch_tensorrt/dynamo/observer.py"
      - "py/torch_tensorrt/dynamo/partitioning/**"
      - "py/torch_tensorrt/dynamo/conversion/_TRTBuilderMonitor.py"
      - "py/torch_tensorrt/dynamo/conversion/_TRTInterpreter.py"
      - "py/torch_tensorrt/dynamo/conversion/_conversion.py"
      - "py/torch_tensorrt/dynamo/debug/_Debugger.py"
      - "tests/py/dynamo/conversion/test_trt_builder_monitor_events.py"
      - "tests/py/dynamo/test_observer_contexts.py"
      - "tests/py/dynamo/test_reporting_stages.py"
      - "tests/py/dynamo/runtime/test_agent_reports.py"
      - "tools/check_agent_contracts.py"
      - "tools/test_check_agent_contracts.py"
      - "schemas/reporting/**"
      - "tests/py/reporting/**"
      - "tests/py/verification/**"
      - "docsrc/user_guide/agent_workflows/**"
      - "docsrc/index.rst"
      - ".github/workflows/agent-workflows.yml"
  push:
    branches: [main]
    paths:
      - "setup.py"
      - "py/torch_tensorrt/reporting/**"
      - "py/torch_tensorrt/verification/**"
      - "py/torch_tensorrt/_compile.py"
      - "py/torch_tensorrt/__init__.py"
      - "py/torch_tensorrt/dynamo/__init__.py"
      - "py/torch_tensorrt/dynamo/_reporting.py"
      - "py/torch_tensorrt/dynamo/_compiler.py"
      - "py/torch_tensorrt/dynamo/_DryRunTracker.py"
      - "py/torch_tensorrt/dynamo/observer.py"
      - "py/torch_tensorrt/dynamo/partitioning/**"
      - "py/torch_tensorrt/dynamo/conversion/_TRTBuilderMonitor.py"
      - "py/torch_tensorrt/dynamo/conversion/_TRTInterpreter.py"
      - "py/torch_tensorrt/dynamo/conversion/_conversion.py"
      - "py/torch_tensorrt/dynamo/debug/_Debugger.py"
      - "tests/py/dynamo/conversion/test_trt_builder_monitor_events.py"
      - "tests/py/dynamo/test_observer_contexts.py"
      - "tests/py/dynamo/test_reporting_stages.py"
      - "tests/py/dynamo/runtime/test_agent_reports.py"
      - "tools/check_agent_contracts.py"
      - "tools/test_check_agent_contracts.py"
      - "schemas/reporting/**"
      - "tests/py/reporting/**"
      - "tests/py/verification/**"
      - "docsrc/user_guide/agent_workflows/**"
      - "docsrc/index.rst"
      - ".github/workflows/agent-workflows.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-workflows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-compatibility:
    name: Reporting contract compatibility
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Check pull request contracts against the base commit
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          python tools/check_agent_contracts.py \
            --base-ref "$BASE_REF" \
            --require-merge-parent
      - name: Check pushed contracts against the previous main revision
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          BASE_REF: ${{ github.event.before }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          python tools/check_agent_contracts.py --base-ref "$BASE_REF"

  cpu-contracts:
    name: CPU contracts / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pytest jsonschema numpy sphinx
      - name: Verify that GPU compiler distributions were not provisioned
        run: |
          python - <<'PY'
          import importlib.metadata
          import torch
          assert torch.version.cuda is None
          for name in ("torch-tensorrt", "torch-tensorrt-rtx", "tensorrt", "tensorrt-rtx"):
              try:
                  importlib.metadata.version(name)
              except importlib.metadata.PackageNotFoundError:
                  continue
              raise RuntimeError(f"CPU CI unexpectedly installed {name}")
          PY
      - name: Test reports, schemas, and CPU verification
        run: |
          python -m pytest \
            tests/py/reporting \
            tests/py/verification/test_verification.py \
            tests/py/dynamo/test_observer_contexts.py \
            tools/test_check_agent_contracts.py \
            -q -o addopts="" --noconftest --junitxml=agent-core-tests.xml
      - name: Build the focused Core documentation without native imports
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          import tempfile
          from sphinx.cmd.build import build_main
          with tempfile.TemporaryDirectory(prefix="agent-workflow-docs-") as directory:
              root = Path(directory)
              source = root / "source"
              shutil.copytree("docsrc/user_guide/agent_workflows", source)
              (source / "conf.py").write_text(
                  "project = 'Torch-TensorRT Agent Workflows'\n"
                  "extensions = []\nmaster_doc = 'index'\n"
              )
              raise SystemExit(build_main([
                  "-W", "--keep-going", "-b", "html", str(source), str(root / "html")
              ]))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-core-results-py${{ matrix.python }}
          path: agent-core-tests.xml
          if-no-files-found: warn

# Real CUDA/compiler tests run in existing provisioned GPU lanes. This workflow
# deliberately has no self-hosted job and never installs native Torch-TensorRT.
