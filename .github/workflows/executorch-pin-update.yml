name: Update ExecuTorch pin

# Keep the ExecuTorch pin close to upstream without a human running the bump by hand. On
# main this tracks the nightly line every day; the newest wheel the index actually carries
# is by definition the newest one that built, so a failed nightly simply leaves the pin
# where it was. The bump lands as a pull request, not a direct push, so the existing pin
# guards and the executorch end-to-end lane decide whether the new wheel is usable before
# it reaches main.
#
# A schedule reaches only the default branch, so this never fires on a release branch at all.
# Re-pinning a cut release is a manual dispatch with track=stable, and it refuses once that
# release has a final tag, because a shipped pin is history.

on:
  schedule:
    # A few hours after the nightly index publishes, so the freshest wheel is available.
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      track:
        description: "Which ExecuTorch line to pin to"
        type: choice
        default: nightly
        options:
          - nightly
          - stable
      allow_downgrade:
        description: "Allow proposing an older ExecuTorch version"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update-pin:
    runs-on: ubuntu-latest
    if: ${{ ! contains(github.actor, 'pytorchbot') }}
    environment: pytorchbot-env
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # No token and no stored credentials. Only the step that opens the pull request needs to
          # act as the bot, and it takes its own token, so leaving the bot's credentials in the git
          # config would hand push rights to every later step and to the actions they run.
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install updater dependencies
        run: python -m pip install packaging pyyaml

      - name: Install uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          # Pinned rather than latest, and the pin is load-bearing. The project asks for python
          # >=3.10 with no ceiling, so a resolver that splits by interpreter version tries to satisfy
          # the newest one, and the dependency chain does not reach it: 0.12.15 fails the lock
          # refresh on a tree that 0.12.5 resolves. Raise this only together with a ceiling on the
          # declared range, or the refresh breaks with no change of ours behind it.
          version: "0.12.5"

      - name: Choose the track
        id: track
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          TRACK: ${{ inputs.track }}
        run: |
          set -euo pipefail
          # A release branch may only take a stable line: a nightly would drift a cut release onto
          # an unreleased ExecuTorch. A schedule reaches only the default branch, so re-pinning a
          # release branch is always a manual dispatch and that is where its guards belong.
          # Trigger values arrive through env, so a crafted ref is shell data, not shell source.
          if [ "$EVENT" = "workflow_dispatch" ]; then
            if [ "$TRACK" = "nightly" ] && [ "$REF" != "refs/heads/main" ]; then
              echo "refusing to pin $REF to a nightly; re-run with track=stable" >&2
              exit 1
            fi
            case "${REF#refs/heads/}" in
              release/*)
                # Once a release ships its pin is history. A candidate tag is not a release, so
                # match a final tag only, or a dispatch during a release candidate would refuse.
                version="${REF#refs/heads/release/}"
                # Any value other than an explicit false counts as tagged, so a typo closes the
                # guard rather than skipping it. Only an empty value asks for the real lookup.
                tagged=""
                if [ -n "${RELEASE_TAGGED:-}" ]; then
                  # Any value other than an explicit false counts as tagged, so a typo closes the
                  # guard rather than skipping it.
                  [ "${RELEASE_TAGGED}" != "false" ] && tagged="yes"
                else
                  # Separate the lookup from its result. Piping straight into grep made a failed
                  # lookup indistinguishable from a release with no tag, so a network or auth
                  # problem let a shipped release be re-pinned.
                  if ! remote_tags=$(git ls-remote --tags origin "v${version}.*" 2>&1); then
                    echo "could not list tags for release $version: ${remote_tags}" >&2
                    exit 1
                  fi
                  # The version goes into a pattern, so a version that is not a plain number can make the
                  # search fail rather than answer. Treat anything but a clean yes or no as a refusal,
                  # because the alternative is re-pinning a release that is already tagged.
                  case "${version}" in
                    *[!0-9.]*) echo "release version ${version} is not numeric" >&2; exit 1 ;;
                  esac
                  # The status is captured in the same command because this step runs under set -e: a
                  # bare pipeline whose grep finds nothing exits the step before the case can read it,
                  # which turned the ordinary answer, that a release is not tagged yet, into a failure.
                  tag_status=0
                  printf '%s\n' "${remote_tags}" |
                    grep -qE "refs/tags/v${version}\.[0-9]+$" || tag_status=$?
                  case "${tag_status}" in
                    0) tagged="yes" ;;
                    1) ;;
                    *) echo "could not decide whether release ${version} is tagged" >&2; exit 1 ;;
                  esac
                fi
                if [ -n "${tagged}" ]; then
                  echo "release $version already has a tag; its pin stays as shipped" >&2
                  exit 1
                fi
                ;;
            esac
            echo "track=$TRACK" >> "$GITHUB_OUTPUT"
          elif [ "$REF" = "refs/heads/main" ]; then
            echo "track=nightly" >> "$GITHUB_OUTPUT"
          else
            echo "no scheduled pin update on $REF"
            echo "track=" >> "$GITHUB_OUTPUT"
          fi

      - name: Update the pin
        id: update
        if: steps.track.outputs.track != ''
        env:
          TRACK: ${{ steps.track.outputs.track }}
          ALLOW_DOWNGRADE: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_downgrade }}
        run: |
          set -euo pipefail
          args=(--track "$TRACK")
          # A release branch inherits main's nightly pin, and every stable release sorts below a
          # nightly, so the first re-pin of a cut branch is always a nominal downgrade. That is
          # the whole point of the stable track, not a mistake to refuse, so allow it there and
          # keep the guard for main.
          if [ "$ALLOW_DOWNGRADE" = "true" ] || [ "$TRACK" = "stable" ]; then
            args+=(--allow-downgrade)
          fi
          python .github/scripts/update_executorch_pin.py "${args[@]}"
          PYTHON_ONLY=1 uv lock --refresh --prerelease=allow
          if git diff --quiet; then
            echo "the pin and development lock are already current"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "version=$(python -c 'import yaml; print(yaml.safe_load(open("dev_dep_versions.yml"))["__executorch_version__"])')" >> "$GITHUB_OUTPUT"
          fi

      - name: Open a pull request
        if: steps.update.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GH_PYTORCHBOT_TOKEN }}
          branch: executorch-pin-update/${{ github.ref_name }}/${{ steps.track.outputs.track }}
          delete-branch: true
          commit-message: "Update ExecuTorch pin to ${{ steps.update.outputs.version }}"
          title: "Update ExecuTorch pin to ${{ steps.update.outputs.version }}"
          # The end-to-end ExecuTorch suite only runs on the nightly lane, and an unlabelled
          # pull request gets the fast one, so without these the bump would report green
          # without the delegate having been exercised at all. Standard is named explicitly
          # because that suite has no RTX variant to pay for.
          labels: |
            ci: nightly
            backend: TensorRT
          # The delegate is built from the tree the pinned wheel was built from, so both
          # pins move together to the version and the commit that wheel records for itself.
          # The pin guards and the executorch end-to-end lane gate this pull request.
          body: |
            Move the ExecuTorch pin to `${{ steps.update.outputs.version }}`, the newest
            ${{ steps.track.outputs.track }} wheel on the index. The source commit is read
            from that wheel, so the version pin and the source commit name one ExecuTorch.

            Opened automatically. The pin consistency checks and the ExecuTorch delegate
            build and test lane run here and decide whether this wheel is usable.
          committer: Torch-TensorRT Github Bot <torch-tensorrt.github.bot@nvidia.com>
          author: Torch-TensorRT Github Bot <torch-tensorrt.github.bot@nvidia.com>

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true
