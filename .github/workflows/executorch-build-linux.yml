name: ExecuTorch Delegate Linux Build

on:
  workflow_call:
    inputs:
      build-matrix:
        description: "Build matrix to utilize"
        default: ""
        type: string
      repository:
        description: 'Repository to checkout, defaults to ""'
        default: ""
        type: string
      ref:
        description: 'Reference to checkout, defaults to ""'
        default: ""
        type: string
      test-infra-repository:
        description: "Test infra repository to use"
        default: "pytorch/test-infra"
        type: string
      test-infra-ref:
        description: "Test infra reference to use"
        default: ""
        type: string

jobs:
  filter-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/checkout@v6
      - name: Filter matrix
        id: generate
        run: |
          set -eou pipefail
          MATRIX_BLOB=${{ toJSON(inputs.build-matrix) }}
          LIMIT_PR=${{ (github.event_name == 'push' || github.event_name == 'schedule') && 'false' || 'true' }}
          MATRIX_BLOB="$(python3 .github/scripts/filter-matrix.py --use-rtx false --limit-pr-builds "${LIMIT_PR}" --matrix "${MATRIX_BLOB}")"
          echo "${MATRIX_BLOB}"
          echo "matrix=${MATRIX_BLOB}" >> "${GITHUB_OUTPUT}"

  build:
    needs: filter-matrix
    uses: ./.github/workflows/linux-test.yml
    with:
      job-name: executorch-runtime-build
      repository: ${{ inputs.repository }}
      ref: ${{ inputs.ref }}
      test-infra-repository: ${{ inputs.test-infra-repository }}
      test-infra-ref: ${{ inputs.test-infra-ref }}
      build-matrix: ${{ needs.filter-matrix.outputs.matrix }}
      pre-script: packaging/pre_build_script.sh
      fail-on-empty: false
      upload-artifact: torch-tensorrt-executorch-runtime
      script: |
        set -euo pipefail
        BAZELISK_VERSION="1.26.0"
        case "$(uname -m)" in
          aarch64|arm64)
            BAZEL_PLATFORM="arm64"
            ;;
          x86_64|amd64)
            BAZEL_PLATFORM="amd64"
            ;;
          *)
            echo "Unsupported Bazelisk platform: $(uname -m)"
            exit 1
            ;;
        esac
        mkdir -p "${RUNNER_TEMP}/bin"
        curl -L "https://github.com/bazelbuild/bazelisk/releases/download/v${BAZELISK_VERSION}/bazelisk-linux-${BAZEL_PLATFORM}" \
          -o "${RUNNER_TEMP}/bin/bazel"
        chmod +x "${RUNNER_TEMP}/bin/bazel"
        export PATH="${RUNNER_TEMP}/bin:${PATH}"
        bazel --version

        # ExecuTorch's CUDA wheels are published only on the PyTorch nightly index, so the
        # channel is needed. No --pre: a specifier naming a prerelease admits prereleases by
        # itself, and --pre would apply to every other requirement in the same command too.
        # CU_VERSION selects the row's own channel, which is what keeps the runtime the
        # delegate links to the same CUDA build as the rest of the job.
        EXECUTORCH_INDEX_URL="https://download.pytorch.org/whl/nightly/${CU_VERSION}"
        python -m pip install pyyaml --extra-index-url "${EXECUTORCH_INDEX_URL}" "executorch==1.5.0.dev20260829"
        export TORCH_TENSORRT_EXECUTORCH_RUNTIME_VERSION="$(python -c 'import importlib.metadata; print(importlib.metadata.version("torch-tensorrt"))')"

        # The downloaded wheel has to carry the C++ runtime. A wheel built with
        # PYTHON_ONLY=1 has no libtorchtrt.so, which leaves
        # ENABLED_FEATURES.torch_tensorrt_runtime False, and the export near the
        # end of this script then fails after the Bazel builds have already run.
        # Check it here so the wrong wheel is reported as the wrong wheel.
        python -c 'from torch_tensorrt._features import ENABLED_FEATURES as f; assert f.torch_tensorrt_runtime, f'

        # Bazel truncates a failing action's output at 1 MB by default and then
        # prints nothing but the size, which hid the real error behind
        #   stdout ... exceeds maximum size of
        #     --experimental_ui_max_stdouterr_bytes=1048576 bytes; skipping
        # setup.py already forwards BAZEL_ARGS, so raise the limit rather than
        # debugging blind.
        export BAZEL_ARGS="--experimental_ui_max_stdouterr_bytes=33554432"

        # Build the no-compile-for-users Python runtime wheel.
        python -m pip wheel --no-build-isolation --no-deps --wheel-dir dist py/torch-tensorrt-executorch-runtime
        # this is to build the libtorchtrt.tar.gz
        bazel build //:libtorchtrt --compilation_mode opt --config=linux
        # Run the ExecuTorch backend C++ unit tests, which are otherwise only
        # built, never executed. These tests link TensorRT and CUDA, but Bazel's
        # cc_import ships the unversioned libnvinfer.so and libcudart.so while the
        # loader asks for the versioned sonames, so add the directories holding
        # those to LD_LIBRARY_PATH. Append rather than replace: the toolchain
        # entries already present are still needed.
        bazel_external="$(bazel info output_base)/external"
        for _soname in libnvinfer.so libcudart.so; do
          _dir="$(
            find -L "${bazel_external}" -path "*/lib*/${_soname}.*" -printf '%h\n' 2>/dev/null |
              sort -u | head -n1
          )"
          if [[ -z "${_dir}" ]]; then
            echo "Could not locate a versioned ${_soname} under ${bazel_external}" >&2
            exit 1
          fi
          export LD_LIBRARY_PATH="${_dir}${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}"
        done
        bazel test //tests/cpp/executorch:executorch_backend_tests \
          --compilation_mode opt --config=linux --test_output=errors \
          --test_env=LD_LIBRARY_PATH
        executorch_cmake_location="$(bazel query @executorch//:executorch/CMakeLists.txt --output=location)"
        export EXECUTORCH_SOURCE_DIR="$(dirname "${executorch_cmake_location%%:*}")"
        export EXECUTORCH_ROOT="${EXECUTORCH_SOURCE_DIR}"
        # This proves the range specifier that ships to users, the one in setup.py and the README,
        # actually resolves to an installable wheel on the index. It runs in a fresh venv because
        # the build interpreter already holds the exact pin, so a range install there resolves
        # nothing and proves nothing. --no-deps keeps it to the executorch wheel itself rather than
        # pulling torch again; the export and reference runner below deliberately stay on the build
        # interpreter, whose pin is ABI-matched to the delegate just built. The venv is created
        # before the range-ok marker so the marked install stays directly under its annotation,
        # which the pin guard requires.
        python -m venv "${RUNNER_TEMP}/range-check-venv"
        # pin-check: range-ok
        "${RUNNER_TEMP}/range-check-venv/bin/python" -m pip install --no-deps --extra-index-url "${EXECUTORCH_INDEX_URL}" "executorch>=1.5.0.dev20260829,<1.6"
        python examples/torchtrt_executorch_example/export_static_shape.py \
          --model_path="${RUNNER_TEMP}/torchtrt-reference-runner.pte"
        .github/scripts/verify-executorch-reference-runner.sh \
          "${RUNNER_TEMP}/torchtrt-reference-runner.pte"
