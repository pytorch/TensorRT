# This is a basic workflow to help you get started with Actions

name: Generate Docs

# Controls when the action will run. Triggers the workflow on push or pull request
# events but only for the master branch
on:
  push:
    branches: [main]

jobs:
    build-docs:
        # A CPU runner: nothing here runs on a GPU. The CUDA toolkit this needs
        # to build the extension comes from the builder image, and the only use
        # of torch_tensorrt is importing it so sphinx autodoc can read
        # docstrings. `--gpus all` is dropped with the GPU, since a CPU pod has
        # no nvidia container runtime and the container would fail to start.
        runs-on: mt-l-x86iavx512-16-128
        if: ${{ ! contains(github.actor, 'pytorchbot') }}
        environment: pytorchbot-env
        container:
            image: docker.io/pytorch/manylinux2_28-builder:cuda13.2
        env:
            CUDA_HOME: /usr/local/cuda-13.2
            VERSION_SUFFIX: cu132
            CU_VERSION: cu132
            CHANNEL: nightly
            CI_BUILD: 1
        steps:
            - uses: actions/checkout@v6
              with:
                  ref: ${{github.head_ref}}
                  token: ${{ secrets.GH_PYTORCHBOT_TOKEN }}
            - name: Select Python / CUDA
              run: |
                  git config --global --add safe.directory /__w/TensorRT/TensorRT
                  echo "/opt/python/cp311-cp311/bin/" >> $GITHUB_PATH

            - name: Install base deps
              run: |
                  python3 -m pip install pip --upgrade
                  python3 -m pip install pyyaml numpy torch --pre --extra-index-url https://download.pytorch.org/whl/nightly/cu132
                  ./packaging/pre_build_script.sh
            - name: Get HEAD SHA
              id: vars
              run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
            - name: Build Python Package
              run: |
                  # Use the source-paired wheel, not a newer member of the authoring range.
                  python3 -m pip install --pre ".[executorch]" \
                    "executorch==$(python3 -c 'import yaml;print(yaml.safe_load(open("dev_dep_versions.yml"))["__executorch_version__"])')" \
                    --extra-index-url https://download.pytorch.org/whl/nightly/cu132
            - name: Install uv
              run: |
                  curl -LsSf https://astral.sh/uv/install.sh | sh
                  echo "$HOME/.local/bin" >> $GITHUB_PATH
            - name: Generate New Docs
              run: |
                  dnf clean all
                  dnf makecache --refresh
                  dnf install yum-utils -y
                  dnf config-manager --set-enabled powertools
                  dnf update --skip-broken --nobest -y
                  dnf install -y doxygen pandoc
                  uv pip install --system -r docsrc/requirements.txt
                  python3 -c "import torch_tensorrt; print(torch_tensorrt.__version__)"
                  cd docsrc && make html
                  cd ..
            - uses: stefanzweifel/git-auto-commit-action@v4
              with:
                  # Required
                  commit_message: "docs: [Automated] Regenerating documenation for ${{ steps.vars.outputs.sha }}"
                  commit_options: "--no-verify --signoff"
                  file_pattern: docs/
                  commit_user_name: Torch-TensorRT Github Bot
                  commit_user_email: torch-tensorrt.github.bot@nvidia.com
                  commit_author: Torch-TensorRT Github Bot <torch-tensorrt.github.bot@nvidia.com>

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true
