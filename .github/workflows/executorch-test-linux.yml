name: ExecuTorch Delegate Linux Test

on:
  workflow_call:
    inputs:
      build-matrix:
        description: "Build matrix to utilize"
        default: ""
        type: string
      repository:
        description: 'Repository to checkout, defaults to ""'
        default: ""
        type: string
      ref:
        description: 'Reference to checkout, defaults to ""'
        default: ""
        type: string
      test-infra-repository:
        description: "Test infra repository to use"
        default: "pytorch/test-infra"
        type: string
      test-infra-ref:
        description: "Test infra reference to use"
        default: ""
        type: string

jobs:
  filter-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/checkout@v6
      - name: Filter matrix
        id: generate
        run: |
          set -eou pipefail
          MATRIX_BLOB=${{ toJSON(inputs.build-matrix) }}
          LIMIT_PR=${{ (github.event_name == 'push' || github.event_name == 'schedule') && 'false' || 'true' }}
          MATRIX_BLOB="$(python3 .github/scripts/filter-matrix.py --use-rtx false --limit-pr-builds "${LIMIT_PR}" --matrix "${MATRIX_BLOB}")"
          echo "${MATRIX_BLOB}"
          echo "matrix=${MATRIX_BLOB}" >> "${GITHUB_OUTPUT}"

  test:
    needs: filter-matrix
    uses: ./.github/workflows/linux-test.yml
    with:
      job-name: executorch-runtime-test
      repository: ${{ inputs.repository }}
      ref: ${{ inputs.ref }}
      test-infra-repository: ${{ inputs.test-infra-repository }}
      test-infra-ref: ${{ inputs.test-infra-ref }}
      build-matrix: ${{ needs.filter-matrix.outputs.matrix }}
      pre-script: packaging/pre_build_script.sh
      script: |
        set -euo pipefail
        mkdir -p "${RUNNER_TEMP}/bin"
        curl -L "https://github.com/bazelbuild/bazelisk/releases/download/v1.26.0/bazelisk-linux-amd64" \
          -o "${RUNNER_TEMP}/bin/bazel"
        chmod +x "${RUNNER_TEMP}/bin/bazel"
        export PATH="${RUNNER_TEMP}/bin:${PATH}"

        python -m pip install pyyaml "executorch==1.4.1"
        # The standard wheel build packages the matching runtime wheel in its
        # artifact alongside torch_tensorrt*.whl; install it after the shared
        # core-wheel installer has selected the matrix-matched core wheel.
        shopt -s nullglob
        runtime_wheels=(/opt/torch-tensorrt-builds/torch_tensorrt_executorch_runtime*.whl)
        echo "Downloaded wheel artifact contents:"
        find /opt/torch-tensorrt-builds -maxdepth 1 -type f -name '*.whl' -printf '  %f (%s bytes)\n' | sort
        if [[ ${#runtime_wheels[@]} -ne 1 ]]; then
          echo "::error::Expected exactly one ExecuTorch runtime wheel in the standard artifact; found ${#runtime_wheels[@]}" >&2
          exit 1
        fi
        echo "Installing ExecuTorch runtime wheel: ${runtime_wheels[0]}"
        python -m pip install --no-deps "${runtime_wheels[0]}"
        # Run the check directly so its exit status is the step's exit status.
        # Wrapping it in `gdb --batch` reports gdb's own status, which is 0
        # whatever the program does, so a SIGSEGV here was passing.
        # On failure, re-run under gdb for the backtrace, then fail the step.
        ulimit -c unlimited || true
        runtime_check='import torch; print(torch.__version__, torch.version.cuda); from torch_tensorrt_executorch_runtime import BACKEND_NAME, get_runtime; print(1); runtime = get_runtime(); print(2); assert runtime.backend_registry.is_available(BACKEND_NAME); assert runtime.backend_registry.is_available("XnnpackBackend"); assert runtime.backend_registry.is_available("CudaBackend")'
        check_status=0
        PYTHONFAULTHANDLER=1 python -u -X faulthandler -c "${runtime_check}" ||
          check_status=$?
        if [[ "${check_status}" -ne 0 ]]; then
          echo "::error::native runtime check failed with status ${check_status}"
          if command -v gdb >/dev/null 2>&1; then
            gdb --batch -ex "set pagination off" -ex run \
              -ex "thread apply all bt" \
              --args python -u -X faulthandler -c "${runtime_check}" || true
          fi
          exit "${check_status}"
        fi

        source tests/py/utils/ci_helpers.sh
        trt_tier_executorch

        bazel build //:libtorchtrt --compilation_mode opt --config=linux
        # Execute the delegate C++ unit tests as well as building the Python
        # examples below. Bazel's cc_import provides unversioned CUDA/TensorRT
        # libraries, while the loader resolves versioned sonames, so expose the
        # directories containing those sonames to the test process.
        bazel_external="$(bazel info output_base)/external"
        for _soname in libnvinfer.so libcudart.so; do
          _dir="$(
            find -L "${bazel_external}" -path "*/lib*/${_soname}.*" -printf '%h\n' 2>/dev/null |
              sort -u | head -n1
          )"
          if [[ -z "${_dir}" ]]; then
            echo "Could not locate a versioned ${_soname} under ${bazel_external}" >&2
            exit 1
          fi
          export LD_LIBRARY_PATH="${_dir}${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}"
        done
        bazel test //tests/cpp/executorch:executorch_backend_tests \
          --compilation_mode opt --config=linux --test_output=errors \
          --test_env=LD_LIBRARY_PATH
        executorch_cmake_location="$(bazel query @executorch//:executorch/CMakeLists.txt --output=location)"
        export EXECUTORCH_SOURCE_DIR="$(dirname "${executorch_cmake_location%%:*}")"
        export EXECUTORCH_ROOT="${EXECUTORCH_SOURCE_DIR}"
        python examples/torchtrt_executorch_example/export_static_shape.py \
          --model_path="${RUNNER_TEMP}/torchtrt-python.pte"
        python examples/torchtrt_executorch_example/export_kv_cache_decode.py \
          --model_path="${RUNNER_TEMP}/torchtrt-kv-cache-decode.pte"
        python examples/torchtrt_executorch_example/export_coalesced.py \
          --model_path="${RUNNER_TEMP}/torchtrt-coalesced.pte"
        .github/scripts/verify-executorch-reference-runner.sh \
          "${RUNNER_TEMP}/torchtrt-python.pte" \
          "${RUNNER_TEMP}/torchtrt-kv-cache-decode.pte" \
          "${RUNNER_TEMP}/torchtrt-coalesced.pte"
        python examples/executorch_reference_runner/load_model.py \
          --model_path="${RUNNER_TEMP}/torchtrt-python.pte" --num_runs=1
