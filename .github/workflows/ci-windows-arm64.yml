name: CI Windows ARM64

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  pull_request_review:
    types: [submitted]
  push:
    branches: [main]
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:

  build:
    uses: ./.github/workflows/build_windows.yml
    with:
      repository: ${{ github.repository }}
      ref: ${{ github.sha }}
      build-matrix: >-
        {"include":[{"build_name":"windows-arm64-cross","python_version":"3.13","desired_cuda":"cu134","validation_runner":"windows.g5.4xlarge.nvidia.gpu"}]}
      architecture: x64
      cross-compile: true
      use-rtx: true
      timeout: 120
      skip-binary-upload: true

  gate:
    needs: [build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Gate Windows ARM64 builds
        env:
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          set -euo pipefail
          if [[ "${BUILD_RESULT}" != "success" ]]; then
            exit 1
          fi
          echo "Windows ARM64 RTX cross-build gate passed."
