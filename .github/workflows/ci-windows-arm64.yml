name: CI Windows ARM64

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  pull_request_review:
    types: [submitted]
  push:
    branches: [main, nightly, 'release/**']
    tags:
      - v[0-9]+.[0-9]+.[0-9]+-rc[0-9]+
  workflow_dispatch:
concurrency:
  # Non-CI labels and non-approved reviews get isolated groups, so automation and
  # review comments cannot cancel the active pipeline. CI-control labels, approved
  # reviews, and real pushes share the PR group and supersede it cleanly.
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}${{ github.event_name == 'pull_request_review' && github.event.review.state != 'approved' && format('-review-{0}', github.event.review.id) || '' }}${{ (github.event.action == 'labeled' || github.event.action == 'unlabeled') && !contains(fromJSON('[\"ci: full\", \"ci: nightly\", \"backend: TensorRT\", \"backend: TensorRT-RTX\"]'), github.event.label.name) && format('-label-{0}', github.event.label.name) || '' }}"
  cancel-in-progress: true


permissions:
  id-token: write
  contents: read

jobs:
  decide:
    if: >-
      github.event.action != 'labeled' ||
      contains(fromJSON('["ci: full", "ci: nightly", "backend: TensorRT", "backend: TensorRT-RTX"]'), github.event.label.name)
    uses: ./.github/workflows/_decide.yml

  build:
    needs: decide
    if: needs.decide.result == 'success' && needs.decide.outputs.lane != 'skip'
    uses: ./.github/workflows/build_windows.yml
    with:
      repository: ${{ github.repository }}
      ref: ""
      build-matrix: >-
        {"include":[{"build_name":"windows-arm64-cross","python_version":"3.13","desired_cuda":"cu134","validation_runner":"windows.g5.4xlarge.nvidia.gpu"}]}
      architecture: x64
      cross-compile: true
      pre-script: packaging/pre_build_script_windows.sh
      trigger-event: ${{ github.event_name }}
      use-rtx: true
      timeout: 180
      skip-binary-upload: false

  gate:
    needs: [decide, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Gate Windows ARM64 builds
        env:
          DECIDE_RESULT: ${{ needs.decide.result }}
          LANE: ${{ needs.decide.outputs.lane }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          set -euo pipefail
          if [[ "${DECIDE_RESULT}" == "skipped" || "${LANE}" == "skip" ]]; then
            echo "Windows ARM64 build skipped for this event."
            exit 0
          fi
          if [[ "${BUILD_RESULT}" != "success" ]]; then
            exit 1
          fi
          echo "Windows ARM64 RTX cross-build gate passed."
