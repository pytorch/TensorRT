# typos reads this file instead of the repository's pyproject.toml for the files
# in this directory. The session briefs are kept byte for byte as the published
# sessions read them (see SHA256SUMS), so nothing here may be "fixed".
# [default] repeats pyproject.toml's [tool.typos.default] (keep the two in step)
# and adds hexadecimal digests: the prompts' SHA-256 prefixes in the briefs and
# the digests in SHA256SUMS.
[default]
extend-ignore-identifiers-re = [
    "^([A-z]|[a-z])*Nd*",
    "^([A-z]|[a-z])*nd*",
    "activ*([A-z]|[a-z]|[0-9])*,",
]
extend-ignore-re = [
    "(?Rm)^.*(#|//)\\s*spellchecker:disable-line$",
    "(?s)(#|//)\\s*spellchecker:off.*?(#|//)\\s*spellchecker:on",
    "\\b[0-9a-f]{16,64}\\b",
]

[default.extend-words]
arange = "arange"
ptd = "ptd"
thw = "thw"
