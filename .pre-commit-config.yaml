exclude: ^.github/actions/assigner/dist
repos:
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v5.0.0
      hooks:
          - id: check-yaml
          - id: trailing-whitespace
            exclude: ^docs
          - id: check-added-large-files
            args:
                - --maxkb=1000
          - id: check-vcs-permalinks
          - id: check-merge-conflict
          - id: mixed-line-ending
            args:
                - --fix=lf
            exclude: ^docs
    - repo: https://github.com/pre-commit/mirrors-clang-format
      rev: v14.0.6
      hooks:
          - id: clang-format
            types_or: [c++, c, cuda]
    - repo: https://github.com/keith/pre-commit-buildifier
      rev: 8.0.3
      hooks:
          - id: buildifier
            args:
                - --warnings=all
          - id: buildifier-lint
    - repo: https://github.com/abravalheri/validate-pyproject
      rev: v0.24.1
      hooks:
          - id: validate-pyproject
    - repo: https://github.com/pycqa/isort
      rev: 6.0.0
      hooks:
          - id: isort
            name: isort (python)
    - repo: https://github.com/pre-commit/mirrors-mypy
      rev: "v1.15.0"
      hooks:
          - id: mypy
            exclude: "^py/torch_tensorrt/fx|^examples|^tests|^py/torch_tensorrt/dynamo/_experimental|^tools|^docs|noxfile.py|setup.py|versions.py"
    - repo: https://github.com/astral-sh/ruff-pre-commit
      # Ruff version.
      rev: v0.11.7
      hooks:
          - id: ruff
    - repo: https://github.com/psf/black
      rev: 26.3.1
      hooks:
          - id: black
            exclude: ^examples/custom_converters/elu_converter/setup.py|^docs
    - repo: https://github.com/crate-ci/typos
      rev: typos-dict-v0.12.4
      hooks:
          - id: typos
    - repo: local
      hooks:
          - id: uv-lock
            name: uv lock
            # A local hook rather than uv-pre-commit, because that one runs uv with the
            # environment it inherits and offers no way to add to it. Without
            # PYTHON_ONLY=1, setup.py shells out to Bazel to compute the project
            # metadata, so the hook fails with "Could not find bazel in PATH" on any
            # machine that has not built the native library. `just lint` runs this on
            # every commit, so that is most machines.
            #
            # uv is pinned to the version the lock-updating workflows use. A different
            # version resolves the tree differently, so a hook on another uv either fails
            # outright or rewrites the lock into a shape no workflow would produce.
            #
            # --prerelease=allow matches the workflows. pyproject.toml declares the same
            # mode, so this is belt and braces rather than the only thing holding it.
            entry: env PYTHON_ONLY=1 uv lock --prerelease=allow
            language: python
            additional_dependencies: ["uv==0.12.5"]
            # The inputs uv reads when it resolves, so the hook runs when any of them
            # move. Kept in step with the paths filter in uv-lock-check.yml.
            files: ^(uv\.lock|pyproject\.toml|setup\.py|dev_dep_versions\.yml)$
            pass_filenames: false
          - id: dont-commit-upstream
            name: NVIDIA-INTERNAL check
            entry: "!NVIDIA-INTERNAL"
            exclude: "^.pre-commit-config.yaml"
            language: pygrep
            types: [text]
